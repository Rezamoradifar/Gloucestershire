name: Global V3 live TESTNET profit diagnosis (read only)
on:
  pull_request:
    paths:
      - 'scripts/diagnose-global-v3-profit-readonly.mjs'
      - '.github/workflows/global-v3-profit-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-public-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read live Global V3 chain 97 members, check-ins and due position status without wallet signing
        run: |
          node --check scripts/diagnose-global-v3-profit-readonly.mjs
          node scripts/diagnose-global-v3-profit-readonly.mjs --check
