name: Global V2 — read-only token issuer diagnosis
on:
  pull_request:
    paths:
      - 'scripts/inspect-v2-test-token-issuer.mjs'
      - '.github/workflows/v2-token-issuer-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read exact BNB testnet mock-token ownership, balances and optional mint simulation
        run: |
          node --check scripts/inspect-v2-test-token-issuer.mjs
          node scripts/inspect-v2-test-token-issuer.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-v2-token-source-readonly
          path: reports/v2-test-token-issuer-readonly.json
          retention-days: 7
