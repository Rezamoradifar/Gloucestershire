name: Global V3 deferred-claim TESTNET-only acceptance
on:
  pull_request:
    paths:
      - 'contracts/v3/**'
      - 'scripts/compile-global-v3.mjs'
      - 'test/global-v3-*.test.mjs'
      - '.github/workflows/global-v3-deferred-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install pinned offline-test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile only isolated V3; do not deploy
        run: node scripts/compile-global-v3.mjs
      - name: Real mock-token transactions with 100 LOCAL wallet signers
        run: node --test --test-concurrency=1 test/global-v3-deferred-ledger.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-v3-100-account-local-only
          path: reports/global-v3-local-100-account.json
          retention-days: 14
