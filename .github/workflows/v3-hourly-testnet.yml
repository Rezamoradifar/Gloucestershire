name: Isolated V3 hourly testnet checks
on:
  pull_request:
    paths:
      - 'contracts/v3/**'
      - 'scripts/*v3*hourly*'
      - 'scripts/*v3*unified*'
      - 'test/*unified*'
      - 'scripts/global-v3-auto-compound-keeper.mjs'
      - 'scripts/install-global-v3-keeper-timer.sh'
      - 'scripts/test-v3-keeper-systemd-credentials.py'
      - 'test/global-v3-hourly-testnet.test.mjs'
      - 'test/global-v3-auto-compound-keeper.test.mjs'
      - 'test/global-v3-keeper-activation.test.mjs'
      - 'website/src/V3*'
      - 'website/src/v3-*'
      - 'website/src/main.tsx'
      - 'website/src/Root.tsx'
      - 'website/tests/v3-*'
      - '.github/workflows/v3-hourly-testnet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test isolated contract, keeper and verification on a local chain
        run: |
          node --test --test-concurrency=1 test/global-v3-hourly-testnet.test.mjs test/global-v3-auto-compound-keeper.test.mjs test/global-v3-keeper-activation.test.mjs
          python3 scripts/test-v3-keeper-systemd-credentials.py
          python3 scripts/test-v3-hourly-site-installer.py
          python3 scripts/test-v3-hourly-setup.py
          bash -n scripts/install-v3-hourly-testnet-site.sh
          bash -n scripts/setup-v3-hourly-testnet.sh
      - name: Verify dashboard with accelerated and standard clocks
        run: |
          npm ci --prefix website --ignore-scripts --no-audit --no-fund
          npm test --prefix website -- --maxWorkers=2
          VITE_V3_HOURLY_TEST=isolated-1h VITE_V3_PRIMARY_DASHBOARD=verified-testnet VITE_V3_CONTRACT_ADDRESS=0x1111111111111111111111111111111111111111 VITE_V3_RUNTIME_HASH=0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa VITE_V3_DEPLOYMENT_TX=0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb npm run build --prefix website
          grep -RilF 'ONE-HOUR BNB TESTNET CONTRACT' website/dist/assets --include='*.js' >/dev/null

  unified-testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise isolated deployment, crash recovery and grouped accounting
        run: node --test --test-concurrency=2 test/*unified*.test.mjs
      - name: Check publication and installation
        run: |
          python3 test/test-v3-unified-start.py
          python3 test/test-v3-unified-apply.py
          python3 test/test-v3-unified-route-http.py
          bash -n scripts/install-v3-unified-worker.sh
