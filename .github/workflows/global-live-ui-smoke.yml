name: Global V2 live browser smoke

on:
  push:
    branches:
      - codex/global-v2-runtime-stability-20261111
      - codex/global-landing-relaunch-20261111
      - codex/global-complete-history-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install isolated browser driver
        run: npm install --prefix /tmp/global-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Confirm chrome
        run: command -v google-chrome || command -v chromium
      - name: Verify public landing and dashboard in desktop and mobile Chrome
        env:
          GLOBAL_PLAYWRIGHT_MODULE: /tmp/global-browser/node_modules/playwright/index.mjs
        run: node scripts/smoke-global-public-ui.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-v2-smoke-screenshots
          path: smoke-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 3


  local-preview-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Build updated frontend
        run: |
          npm ci --prefix website --no-audit --no-fund
          npm run build --prefix website
      - name: Install isolated browser driver
        run: npm install --prefix /tmp/global-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Start mock API and Vite preview
        run: |
          nohup node scripts/mock-global-ui-api.mjs >/tmp/global-ui-api.log 2>&1 </dev/null &
          nohup npm run preview --prefix website -- --host 127.0.0.1 --port 4173 >/tmp/global-ui-preview.log 2>&1 </dev/null &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3115/api/config >/dev/null &&
               curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
               echo GLOBAL_LOCAL_UI_READY
               exit 0
            fi
            sleep 1
          done
          cat /tmp/global-ui-api.log /tmp/global-ui-preview.log
          exit 1
      - name: Test built UI and mobile theme without wallet permissions
        env:
          GLOBAL_PLAYWRIGHT_MODULE: /tmp/global-browser/node_modules/playwright/index.mjs
          GLOBAL_SMOKE_BASE: http://127.0.0.1:4173
          GLOBAL_EXPECT_LANDING_V3: '1'
        run: node scripts/smoke-global-public-ui.mjs
      - name: Save local preview screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-v2-fixed-preview-screenshots
          path: smoke-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 3
