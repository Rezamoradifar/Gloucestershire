name: Global V2-only website release checks
on:
  pull_request:
    paths:
      - 'website/**'
      - 'ubuntu-global-v2-site.sh'
      - 'scripts/verify-v3-site-deployment.mjs'
      - 'scripts/install-v3-site-when-verified.sh'
      - 'scripts/launch-v3-site-after-deployment.sh'
      - 'scripts/release-v3-testnet-and-website.sh'
      - 'test/v3-site-release-gate.test.mjs'
      - 'ubuntu-v2-support-install.sh'
      - 'server/community.mjs'
      - 'server/trades-api.mjs'
      - 'test/v2-community-isolation.test.mjs'
      - '.github/workflows/global-v2-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix website --no-audit --no-fund
      - name: Frontend regression tests, TypeScript and build
        run: npm test --prefix website -- --maxWorkers=2 && npm run build --prefix website
      - name: New V2-only support service signature and data-isolation checks
        run: |
          node --check server/trades-api.mjs
          node --check server/community.mjs
          node --check server/v2-read-rpc.mjs
          node --check scripts/fund-v2-testnet-treasury-server.mjs
          node --check scripts/verify-v3-site-deployment.mjs
          bash -n scripts/install-v3-site-when-verified.sh
          bash -n scripts/launch-v3-site-after-deployment.sh
          bash -n scripts/release-v3-testnet-and-website.sh
          node --test test/v3-site-release-gate.test.mjs
          node --test test/v2-server-testnet-treasury.test.mjs
          bash -n ubuntu-v2-support-install.sh
          bash -n scripts/run-v2-testnet-stack.sh
          node --test test/v2-community-isolation.test.mjs test/v2-read-rpc.test.mjs test/v2-read-rpc-integration.test.mjs
      - name: Site-only installer and bundle isolation
        shell: bash
        run: |
          set -euo pipefail
          bash -n ubuntu-global-v2-site.sh
          test -s website/dist/index.html
          grep -RilF '0xA98D8d3709f5D3730BAD5d76C334731784e7CF07' website/dist/assets --include='*.js' >/dev/null
          if grep -RilE '0x4c0f6141b18971db4b14e45c0be8cddb09febc14|/api/trades\?limit|/api/config' website/dist/assets --include='*.js' >/dev/null; then
            echo 'V2_SITE_OLD_CONTRACT_REFERENCE_DETECTED'
            exit 1
          fi
          echo 'V2_EXCLUSIVE_FRONTEND_BUNDLE_PASS'
